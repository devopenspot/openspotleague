# Every push to main: CI, then migrate, build, deploy and smoke-test develop.
# docs/ci-cd.md §5. Secrets: GitHub environment "develop" (docs/environments.md).
name: deploy-develop

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# One deploy at a time; a newer push replaces a queued one, a running deploy
# is never cancelled.
concurrency:
  group: deploy-develop
  cancel-in-progress: false

jobs:
  ci:
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read
      pull-requests: read

  deploy:
    needs: ci
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: develop
      url: https://dev.openspotleague.com
    env:
      OPENSPOT_ENV: develop
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup

      - name: Migrate develop
        env:
          SUPABASE_DIRECT_URL: ${{ secrets.SUPABASE_MIGRATION_URL }}
        run: pnpm db:apply

      - name: Build
        run: pnpm build:develop

      - name: Deploy
        env:
          DEPLOY_MESSAGE: ${{ github.event.head_commit.message || 'manual deploy' }}
          ADMIN_EMAILS: ${{ secrets.ADMIN_EMAILS }}
          API_KEY_WEATHER: ${{ secrets.API_KEY_WEATHER }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        run: pnpm deploy:develop

      - name: Smoke
        run: pnpm smoke develop
