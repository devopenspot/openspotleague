# Nightly League chain test against develop: creates a contest, runs it to
# published results, and removes what it created. Develop only (egress).
name: smoke-db

on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: db-task-develop
  cancel-in-progress: false

jobs:
  league-chain:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: develop
    env:
      OPENSPOT_ENV: develop
      RUN_DB_SMOKE: "1"
      SUPABASE_DIRECT_URL: ${{ secrets.SUPABASE_MIGRATION_URL }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      - run: pnpm test src/lib/services/league/league-chain.smoke.test.ts
